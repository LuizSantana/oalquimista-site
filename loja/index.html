<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OAlquimista — Mostarda Artesanal Fórmula II | Loja</title>
  <meta name="description" content="Peça a mostarda artesanal O Alquimista — Fórmula II, feita em pequenos lotes direto do produtor." />
  <link rel="canonical" href="https://oalquimista.store/loja/" />
  <link rel="icon" href="../assets/icons/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />

  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="OAlquimista" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Mostarda Artesanal O Alquimista — Fórmula II" />
  <meta property="og:description" content="Mostarda artesanal feita em pequenos lotes, direto do produtor. Faça seu pedido." />
  <meta property="og:url" content="https://oalquimista.store/loja/" />
  <meta property="og:image" content="https://oalquimista.store/assets/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Mostarda Artesanal O Alquimista — Fórmula II" />
  <meta name="twitter:description" content="Mostarda artesanal feita em pequenos lotes, direto do produtor." />
  <meta name="twitter:image" content="https://oalquimista.store/assets/icons/icon-512.png" />

  <link rel="stylesheet" href="style.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="wrap">
    <div class="site-nav">
      <a href="../">Início</a><span class="sep">·</span>
      <a href="../sobre/">Sobre</a><span class="sep">·</span>
      <a href="./" class="active">Loja</a><span class="sep">·</span>
      <a href="../suporte/">Suporte</a><span class="sep">·</span>
      <a href="../novidades/">Novidades</a><span class="sep">·</span>
      <a href="../termos/">Termos</a><span class="sep">·</span>
      <a href="../privacidade/">Privacidade</a>
    </div>

    <header class="page-header">
      <img src="../assets/icons/hero-icon.png" alt="O Alquimista" />
      <h1>Mostarda Artesanal O Alquimista — Fórmula II</h1>
      <p class="intro">Feita em pequenos lotes, direto do produtor. Faça seu pedido abaixo.</p>
    </header>

    <section>
      <h2><span class="dot"></span>Pedido</h2>
      <form id="order-form" class="order-form" novalidate>
        <label>
          Produto
          <select name="product" required>
            <option value="Mostarda O Alquimista — Fórmula II">Mostarda O Alquimista — Fórmula II</option>
          </select>
        </label>
        <label>
          Quantidade
          <input type="number" name="quantity" min="1" max="999" value="1" required />
        </label>
        <label>
          Nome
          <input type="text" name="name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Telefone <span class="optional">(opcional)</span>
          <input type="tel" name="phone" />
        </label>
        <label>
          Endereço de entrega <span class="optional">(opcional)</span>
          <textarea name="address" rows="2"></textarea>
        </label>
        <label>
          Observações <span class="optional">(opcional)</span>
          <textarea name="notes" rows="2"></textarea>
        </label>
        <!-- Honeypot — real visitors never see or fill this field. -->
        <label class="honeypot" aria-hidden="true">
          Website
          <input type="text" name="website" tabindex="-1" autocomplete="off" />
        </label>

        <!-- TODO: troque pelo seu site key depois de criar o widget em
             dash.cloudflare.com/?to=/:account/turnstile -->
        <div class="cf-turnstile" data-sitekey="SEU_TURNSTILE_SITE_KEY"></div>

        <button type="submit">Enviar pedido</button>
        <p id="order-status" class="order-status" role="status"></p>
      </form>
    </section>

    <footer>
      <p>OAlquimista — <a href="../">oalquimista.store</a></p>
    </footer>
  </div>

  <script>
    // Preencha com a URL real do backend depois do deploy (veja BackendNode/infra/deploy.sh).
    const ORDERS_API_BASE = "https://SEU-SERVIDOR-AQUI/v1/orders";

    const form = document.getElementById("order-form");
    const status = document.getElementById("order-status");
    let formToken = null;

    async function fetchFormToken() {
      try {
        const res = await fetch(`${ORDERS_API_BASE}/token`);
        const data = await res.json();
        formToken = data.token;
      } catch (err) {
        // Submit will fail with a clear error below if this never resolves.
      }
    }
    fetchFormToken();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!formToken) {
        status.textContent = "Ainda carregando o formulário — aguarde um instante e tente de novo.";
        status.className = "order-status error";
        return;
      }

      status.textContent = "Enviando...";
      status.className = "order-status";

      const data = Object.fromEntries(new FormData(form).entries());
      data.quantity = Number(data.quantity);
      data.formToken = formToken;
      data.turnstileToken = data["cf-turnstile-response"] ?? "";
      delete data["cf-turnstile-response"];

      try {
        const res = await fetch(ORDERS_API_BASE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        if (!res.ok) throw new Error(`status ${res.status}`);

        status.textContent = "Pedido enviado! Entraremos em contato por email em breve.";
        status.className = "order-status success";
        form.reset();
        if (window.turnstile) window.turnstile.reset();
        fetchFormToken();
      } catch (err) {
        status.textContent = "Não foi possível enviar o pedido agora. Tente novamente ou escreva para suporte@oalquimista.store.";
        status.className = "order-status error";
      }
    });
  </script>
</body>
</html>
